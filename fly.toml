# fly.toml app configuration file generated for thefitsnap on 2026-05-28T11:49:04+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'thefitsnap'
primary_region = 'sin'

[build]

[env]
  PORT = '3000'
  SCOPES = 'read_orders,read_products,write_products'
  SHOPIFY_API_KEY = '876421af61b2135a56534b6b182909bd'
  SHOPIFY_APP_URL = 'https://thefitsnap.fly.dev'

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
