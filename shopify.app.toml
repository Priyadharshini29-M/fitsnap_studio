# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "876421af61b2135a56534b6b182909bd"
name = "FitSnap"
application_url = "https://thefitsnap.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri    = "/api/webhook"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri    = "/api/webhook"

# ── Mandatory GDPR / privacy compliance webhooks ─────────────────────────────
# These use a dedicated section — NOT [[webhooks.subscriptions]].
# URLs must be absolute. Update the domain when you set your production URL.
[webhooks.privacy_compliance]
customer_data_request_url = "https://thefitsnap.fly.dev/api/webhook"
customer_deletion_url     = "https://thefitsnap.fly.dev/api/webhook"
shop_deletion_url         = "https://thefitsnap.fly.dev/api/webhook"

[access_scopes]
# read_orders is required by Shopify CLI for the orders/paid webhook subscription.
# Apply for Protected Customer Data access in the Partner Dashboard before submitting to the App Store.
scopes = "read_products,write_products,read_orders"

[auth]
redirect_urls = [ "https://thefitsnap.fly.dev/api/auth" ]
[app_proxy]
url = "https://tryonapp.digifyce.com"

prefix = "apps"
subpath = "tryfit"
