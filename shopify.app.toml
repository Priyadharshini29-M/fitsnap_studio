# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "876421af61b2135a56534b6b182909bd"
name = "FitSnap"
application_url = "https://unrivaled-unheated-unstable.ngrok-free.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri    = "/app/webhook"

# orders/paid requires Protected Customer Data approval in the Partner Dashboard.
# To enable conversion tracking:
#   1. Go to partners.shopify.com → Your App → API access → Protected customer data
#   2. Request access and get approved
#   3. Uncomment the block below and re-run: shopify app deploy

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri    = "/app/webhook"

[access_scopes]
# read_orders requires Protected Customer Data approval — add back after approval.
# Metafield access is included in read_products/write_products — no separate scope needed.
scopes = "read_products,write_products,read_orders"

[auth]
redirect_urls = [ "https://unrivaled-unheated-unstable.ngrok-free.dev/api/auth" ]
[app_proxy]
url = "https://tryonapp.digifyce.com"
prefix = "apps"
subpath = "tryfit"